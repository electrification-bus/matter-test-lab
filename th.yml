---
# Install and configure the Matter Test Harness (project-chip/certification-tool)
# on a fresh Ubuntu Pi. Parameterized: all config lives in inventory.ini +
# group_vars/ (see README.md). No -K needed (cloud-init grants passwordless sudo).
#
# A Pi that already has a checkout is UPDATED to the configured version rather
# than reinstalled; a Pi without one is installed from scratch. The playbook
# decides by looking for the checkout, so the same command is correct either way.
#
# Run:  ansible-playbook th.yml
#   Verify the Pi only:      ansible-playbook th.yml --tags verify
#   Update an existing TH:   ansible-playbook th.yml --tags update
#   Just the CLI + backend:  ansible-playbook th.yml --tags thcli,backend
#   Skip the long install:   ansible-playbook th.yml --skip-tags install
#
# Tags: verify | install (git clone + auto-install + reboot, fresh Pi only) |
#       update (auto-update + start, existing checkout only) | apt | ports |
#       thcli (install th-cli) | backend (self-heal the backend container)

- name: Install and configure the Matter Test Harness
  hosts: th
  gather_facts: true

  tasks:
    # In event mode this repo ships no coordinates, so fail immediately and
    # explain, rather than cloning and failing on an unresolvable ref after the
    # apt work is already done. In development mode a published default is used.
    - name: Require a Test Harness version
      ansible.builtin.assert:
        that: th_version_effective | trim | length > 0
        fail_msg: >-
          lab_mode is "event" but th_version is not set. A test event pins a
          specific Test Harness tag and you must use that exact one, so this
          repo intentionally ships no value and will not guess: take it from
          your own test event materials. Set it in host_vars/<your-th-host>.yml
          or pass -e th_version=<tag>. It must correspond to the same event as
          the SDK commit the DUT is built from (group_vars/dut.yml: sdk_sha).
          If you are NOT at a test event, set lab_mode=development instead and a
          published Test Harness release will be used automatically.
        success_msg: >-
          Test Harness {{ th_version_effective | trim }} (lab_mode={{ lab_mode }})
        quiet: true
      tags: [verify, install, update]

    - name: Verify we're on the intended, correctly-flashed Pi
      ansible.builtin.import_tasks: tasks/verify_target.yml
      tags: [verify]

    - name: Prepare apt (stop timers, wait for lock, enable pockets)
      ansible.builtin.import_tasks: tasks/apt_prepare.yml
      tags: [install, update, apt]

    - name: Ensure git is installed
      become: true
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        lock_timeout: 300
      tags: [install, update]

    # Poetry is a prerequisite of BOTH the update path and th-cli: the update
    # runs update-setup-cli-dependencies.sh, which installs the Matter CLI with
    # Poetry and aborts the whole update with "Poetry could not be found" if it
    # is missing. Installed here, ahead of the decision below, so it is present
    # whichever path runs.
    - name: Install pipx (for Poetry and the TH CLI)
      become: true
      ansible.builtin.apt:
        name: pipx
        state: present
        update_cache: true
        lock_timeout: 300
      tags: [install, update, thcli]

    - name: Install Poetry via pipx
      ansible.builtin.shell: |
        export PATH="$HOME/.local/bin:$PATH"
        command -v poetry >/dev/null 2>&1 || pipx install poetry
      args:
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.local/share/pipx/venvs/poetry"
      tags: [install, update, thcli]

    # --- Install or update. Reinstalling over a working Test Harness is not
    # harmless: auto-install.sh redoes the Docker install and the machine
    # configuration and expects a reboot. Upstream's path for moving an existing
    # install to another version is auto-update.sh, so an existing checkout takes
    # that path and only a bare Pi is installed from scratch.
    - name: Look for an existing Test Harness checkout
      ansible.builtin.stat:
        path: "{{ th_dest }}/.git"
      register: th_checkout
      tags: [install, update]

    - name: Report whether this run installs or updates
      ansible.builtin.debug:
        msg: >-
          {{ th_dest }}
          {{ 'already exists: updating it to'
             if th_checkout.stat.exists
             else 'is absent: installing' }}
          {{ th_version_effective | trim }}
      tags: [install, update]

    - name: Clone certification-tool at the pinned version (with submodules)
      ansible.builtin.git:
        repo: "{{ th_repo }}"
        dest: "{{ th_dest }}"
        version: "{{ th_version_effective | trim }}"
        recursive: true
        force: false
      when: not th_checkout.stat.exists
      tags: [install]

    - name: Run the TH auto-install script (long-running, 20-40+ min)
      ansible.builtin.shell:
        cmd: "{{ th_install_script }} </dev/null"
        chdir: "{{ th_dest }}"
      register: install_result
      async: 3600
      poll: 20
      when: not th_checkout.stat.exists
      # It installs Docker, builds containers and writes config: always a change.
      changed_when: true
      # The script only prompts to reboot at the very end (we feed EOF), so it
      # does not self-reboot. Treat a non-zero rc or its "Exit with Error" banner
      # as a real failure instead of letting it pass silently.
      failed_when: >-
        install_result.rc != 0 or
        ('Exit with Error' in (install_result.stdout | default('')))
      tags: [install]

    - name: Show install stderr on failure
      ansible.builtin.debug:
        var: install_result.stderr_lines
      when:
        - install_result.stderr_lines is defined
        - install_result.stderr_lines | length > 0
      tags: [install]

    - name: Reboot the Test Harness to finalize the install
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 30
        post_reboot_delay: 45
        msg: "Finalizing Matter Test Harness install"
      when: not th_checkout.stat.exists
      tags: [install]

    # --- Update path, for a Pi that already has a checkout. auto-update.sh does
    # its own stash before it fetches, which matters because an installed Test
    # Harness leaves modified files in the working tree that would otherwise make
    # the checkout fail. It leaves the containers stopped, so start.sh follows.
    # The PATH export is load-bearing. pipx puts Poetry in ~/.local/bin, which a
    # non-interactive SSH shell does not have on PATH, and the update's CLI step
    # exits with "Poetry could not be found" without it. That leaves the Test
    # Harness on the new code with its containers stopped, which looks like a
    # broken install rather than a missing PATH entry.
    - name: Update the Test Harness to the pinned version (long-running)
      ansible.builtin.shell:
        cmd: |
          export PATH="$HOME/.local/bin:$PATH"
          {{ th_update_script }} {{ th_version_effective | trim }} </dev/null
        chdir: "{{ th_dest }}"
        executable: /bin/bash
      register: update_result
      async: 3600
      poll: 20
      when: th_checkout.stat.exists
      # It checks out code and rebuilds containers: always a change.
      changed_when: true
      # Same banner convention as the install script: a non-zero rc or an
      # "Exit with Error" line in the output is a real failure.
      failed_when: >-
        update_result.rc != 0 or
        ('Exit with Error' in (update_result.stdout | default('')))
      tags: [install, update]

    - name: Show update stderr on failure
      ansible.builtin.debug:
        var: update_result.stderr_lines
      when:
        - update_result.stderr_lines is defined
        - update_result.stderr_lines | length > 0
      tags: [install, update]

    - name: Start the Test Harness containers after the update
      ansible.builtin.shell:
        cmd: |
          export PATH="$HOME/.local/bin:$PATH"
          {{ th_start_script }} </dev/null
        chdir: "{{ th_dest }}"
        executable: /bin/bash
      register: start_result
      when: th_checkout.stat.exists
      # Brings the container stack up: always a change.
      changed_when: true
      tags: [install, update]

    - name: Report the Test Harness version now checked out
      ansible.builtin.command:
        cmd: git rev-parse --abbrev-ref HEAD
        chdir: "{{ th_dest }}"
      register: th_current_ref
      changed_when: false
      tags: [install, update, verify]

    - name: Check which web ports the TH is listening on (informational)
      become: true
      ansible.builtin.shell:
        # The trailing "|| true" is load-bearing: no matching port is a normal
        # result (the stack may still be starting), not a failure.
        cmd: |
          set -euo pipefail
          ss -ltn | grep -E ':({{ th_web_ports }}) ' || true
        executable: /bin/bash
      register: th_ports
      changed_when: false
      tags: [install, update, ports]

    - name: Report TH version and listening ports
      ansible.builtin.debug:
        msg: >-
          Test Harness on {{ th_current_ref.stdout | default('(unknown)') }}.
          Web ports listening:
          {{ th_ports.stdout_lines
             | default(['(none yet; give it a minute, then open http://' + expected_hostname + '.local)']) }}
      tags: [install, update, ports]

    # --- TH CLI: the scriptable interface (the Survival Guide's preferred mode).
    # th_cli_install.sh needs pipx + Poetry, which the Pi image lacks.
    - name: Install th-cli
      ansible.builtin.shell: |
        export PATH="$HOME/.local/bin:$PATH"
        cd "{{ th_dest }}/cli" && bash scripts/th_cli_install.sh </dev/null
      args:
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.local/bin/th-cli"
      tags: [thcli]

    # --- Backend self-heal. The backend clones the SDK during prestart to get the
    # 'matter' python module; if DNS is flaky during the heavy install that clone
    # fails and the backend exits(1). DNS recovers afterward, so a restart re-clones
    # and it comes up. This makes the install resilient to that transient failure.
    - name: Find the TH backend container
      become: true
      ansible.builtin.shell:
        # "|| true" keeps "no such container" a normal empty result rather than
        # a failure: the next task is guarded on stdout being non-empty. It is
        # also what absorbs the SIGPIPE that "head -1" gives the earlier stages
        # once pipefail is on.
        cmd: |
          set -euo pipefail
          docker ps -a --format '{% raw %}{{.ID}} {{.Image}}{% endraw %}' \
            | grep -i certification-tool-backend | awk '{print $1}' | head -1 || true
        executable: /bin/bash
      register: th_backend_id
      changed_when: false
      tags: [backend]

    - name: Start the backend if stopped, then wait for the API to answer
      become: true
      ansible.builtin.shell: |
        set -e
        C="{{ th_backend_id.stdout }}"
        [ -n "$C" ] || { echo "no backend container found"; exit 1; }
        running=$(docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' "$C")
        [ "$running" = "true" ] || docker start "$C"
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                 http://localhost/api/v1/test_run_executions/status || echo 000)
          [ "$code" = "200" ] && { echo READY; exit 0; }
          st=$(docker inspect -f '{% raw %}{{.State.Status}}{% endraw %}' "$C")
          [ "$st" = "exited" ] && { echo "backend exited:"; docker logs --tail 30 "$C"; exit 1; }
          sleep 10
        done
        echo "backend API not ready after 10m"; exit 1
      args:
        executable: /bin/bash
      register: th_backend_health
      changed_when: "'READY' in th_backend_health.stdout"
      when: th_backend_id.stdout | length > 0
      tags: [backend]

    - name: Report backend health
      ansible.builtin.debug:
        msg: >-
          TH backend:
          {{ 'READY (API 200)'
             if (th_backend_health.stdout is defined and 'READY' in th_backend_health.stdout)
             else (th_backend_health.stdout | default('not checked')) }}
      tags: [backend]
