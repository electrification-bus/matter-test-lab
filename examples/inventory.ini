# TEMPLATE. Copy to the repo root and edit:
#
#   cp examples/inventory.ini inventory.ini
#
# inventory.ini is gitignored, so your hardware details never get committed.
#
# Hosts are addressed by mDNS name (<hostname>.local) rather than IP, because Pi
# addresses are DHCP and do move. Provisioning then rides through a lease change
# automatically, and Matter commissioning is itself DNS-SD based so it
# re-resolves too. Nothing else to configure.
#
# Two per-host facts are asserted at the start of every run, so a wrong or stale
# Pi fails in seconds rather than 45 minutes into a build:
#
#   expected_hostname : the short hostname the Pi should report
#   expected_mac      : a MAC belonging to that Pi, verified on-device
#
# Find a Pi's MAC after first boot with:
#   ssh ubuntu@<hostname>.local "ip -o link | awk '{print \$2, \$(NF-2)}'"

[th]
MatterTH.local  expected_hostname=MatterTH  expected_mac=aa:bb:cc:dd:ee:01

[dut]
MatterDUT.local expected_hostname=MatterDUT expected_mac=aa:bb:cc:dd:ee:02

[all:vars]
ansible_user=ubuntu
