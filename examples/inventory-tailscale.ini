# TEMPLATE. Copy to inventory-tailscale.ini (gitignored) to reach Pis over the
# tailnet from off their LAN:
#
#   cp examples/inventory-tailscale.ini inventory-tailscale.ini
#   ansible-playbook -i inventory-tailscale.ini dut.yml --tags verify --limit <host>
#
# Name each host as in inventory.ini, so its host_vars/ file still applies, and
# keep expected_hostname and expected_mac, because verify_target checks them over
# this route too. ansible_host is the tailnet name, which needs MagicDNS on the
# control machine; a tailnet IP also works.
#
# List only hosts with tailscale_enabled. A host that is not on the tailnet cannot
# be reached this way, which is why [th] can stay empty.

[th]

[dut]
MatterDUT.local ansible_host=matterdut expected_hostname=MatterDUT expected_mac=aa:bb:cc:dd:ee:02

[all:vars]
ansible_user=ubuntu
