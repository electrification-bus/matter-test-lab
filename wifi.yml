---
# Join a WiFi network on wlan0, leaving eth0 as it is, so a lab prepared on a
# wired network can run where only WiFi is offered.
#
# The network is yours to supply, in host_vars/ or with -e; this repository
# ships no SSID or password. See "Wired, and what WiFi would take" in README.md.
#
# Run:     ansible-playbook wifi.yml
# Remove:  ansible-playbook wifi.yml -e wifi_state=absent

- name: WiFi on wlan0
  hosts: all
  become: true
  gather_facts: false
  vars:
    wifi_state: present
    wifi_netplan: /etc/netplan/60-wifi.yaml
  tasks:
    - name: Assert a network is configured
      ansible.builtin.assert:
        that:
          - wifi_ssid | length > 0
          - wifi_password | length > 0
        fail_msg: >-
          wifi_ssid and wifi_password are empty. Set them in host_vars/ or pass
          them with -e; this repository ships no network credentials.
        quiet: true
      when: wifi_state == 'present'

    - name: Install iw
      ansible.builtin.apt:
        name: iw
        state: present
      when: wifi_state == 'present'

    # Readable by root only: it holds the password.
    - name: Write the netplan for wlan0
      ansible.builtin.copy:
        dest: "{{ wifi_netplan }}"
        mode: "0600"
        content: |
          network:
            version: 2
            wifis:
              wlan0:
                optional: true
                dhcp4: true
          {% if wifi_regdom | length > 0 %}
                regulatory-domain: "{{ wifi_regdom }}"
          {% endif %}
                access-points:
                  "{{ wifi_ssid }}":
                    password: "{{ wifi_password }}"
      when: wifi_state == 'present'
      notify: Apply netplan

    - name: Remove the netplan for wlan0
      ansible.builtin.file:
        path: "{{ wifi_netplan }}"
        state: absent
      when: wifi_state == 'absent'
      notify: Apply netplan

    # Power save adds latency and drops, and Matter's discovery and CASE
    # timeouts are not generous.
    - name: Install a unit that turns off wlan0 power save
      ansible.builtin.copy:
        dest: /etc/systemd/system/wlan0-powersave-off.service
        mode: "0644"
        content: |
          [Unit]
          Description=Turn off wlan0 power save
          BindsTo=sys-subsystem-net-devices-wlan0.device
          After=sys-subsystem-net-devices-wlan0.device

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/iw dev wlan0 set power_save off

          [Install]
          WantedBy=sys-subsystem-net-devices-wlan0.device
      when: wifi_state == 'present'

    - name: Enable or disable the power save unit
      ansible.builtin.systemd_service:
        name: wlan0-powersave-off.service
        enabled: "{{ wifi_state == 'present' }}"
        state: "{{ 'started' if wifi_state == 'present' else 'stopped' }}"
        daemon_reload: true

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply
      changed_when: true
