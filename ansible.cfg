[defaults]
inventory = inventory.ini
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = yaml
display_skipped_hosts = False

[ssh_connection]
# Keep the SSH connection alive through the long, silent steps (the Test Harness
# auto-install and the DUT build both run for tens of minutes with no output).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=120
pipelining = True
# Use Apple's ssh. A Homebrew ssh rejects UseKeychain, which many macOS
# ~/.ssh/config files set, and the failure is confusing. Harmless on Linux
# only because setup-env.sh clears it there; if you are on Linux and this
# path does not exist, comment it out.
ssh_executable = /usr/bin/ssh
